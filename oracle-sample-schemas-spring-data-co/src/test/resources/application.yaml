#
# Test configuration for oracle-sample-schemas-spring-data-co: the CO schema of the Oracle database that
# oracle-sample-schemas-persistence brings up, not an in-memory stand-in.
#
# Start it from the sibling checkout, which owns the compose file and the install hook:
#
#     cd ../oracle-sample-schemas-persistence && ./compose.sh
#
# That serves the freepdb1 PDB on localhost:1521, with CO, HR and SH installed once by the startup hook.
#
# These are the same coordinates upstream's own integration-test persistence unit uses
# (../oracle-sample-schemas-persistence/oracle-sample-schemas-persistence-co/src/test/resources/META-INF/persistence.xml,
# `co-it`); keep the two in step.
#
spring:
  datasource:
    url: jdbc:oracle:thin:@//localhost:1521/freepdb1
    # `dmlonly`, created by the same startup hook, holds CREATE SESSION plus SELECT/INSERT/UPDATE/DELETE ANY TABLE and
    # nothing else: a test can read and write the sample data but cannot DDL it away. Connecting as CO would make
    # the default_schema below unnecessary, and would give the tests the right to drop the schema they read.
    username: dmlonly
    # Both the container and the installers default to `password`; SAMPLE_SCHEMAS_PASSWORD is the knob the sibling
    # scripts read, so honour it here too.
    password: ${SAMPLE_SCHEMAS_PASSWORD:password}
    # Hikari can infer this from the URL; named anyway so a missing ojdbc17 on the test classpath fails as "driver not
    # found" rather than as a pool timeout.
    driver-class-name: oracle.jdbc.OracleDriver

  jpa:
    hibernate:
      # The sample data is installed by Oracle's own scripts and is the fixture the tests read. Nothing here may touch
      # the schema. `none` is already the default for a non-embedded datasource; spelled out because the cost of
      # getting it wrong is CO.
      ddl-auto: none
    properties:
      hibernate:
        # The entities map UNQUALIFIED table names, so that nothing in them knows which schema it was installed into.
        # Oracle resolves an unqualified name against the session's CURRENT_SCHEMA, here DMLONLY, which owns no
        # objects, so without this every query is ORA-00942. Upstream says the same provider-neutrally, with
        # <persistence-unit-defaults><schema>CO</schema> in its META-INF/co/orm-it.xml.
        default_schema: CO
        # Named rather than detected. Hibernate would otherwise pick the dialect from the JDBC metadata of a first
        # connection, and when that connection fails (no container on 1521) it logs the real cause as HHH000342 and
        # throws "Unable to determine Dialect" instead. With the dialect named, a missing database fails at the first
        # query with the Oracle error itself.
        # NOTE: this file follows a @DataJpaTest onto H2 too, where this dialect and default_schema are wrong; such a
        # test has to override them (see _Repository_DataJpaTest_Configuration).
        dialect: org.hibernate.dialect.OracleDialect
        format_sql: true
        highlight_sql: true
    # No web layer in these tests: a lazy association touched outside a transaction should fail loudly instead of
    # quietly opening a session to satisfy it.
    open-in-view: false
    # Deliberately not `show-sql: true`, which writes straight to System.out and would print every statement twice
    # next to the org.hibernate.SQL logger that logback-spring.xml turns on.
    show-sql: false

# Log levels live in logback-spring.xml, next to this file, not under logging.level here. Boot would lay levels set
# here over that file's; keep them in one place.
