#
# The `h2` profile: an embedded H2 for the @DataJpaTest slices, in place of the Oracle database of application.yaml.
#
# A bare @DataJpaTest would swap the datasource for an H2 of its own; the swap is turned off here and the H2 is named
# in full, in the mode upstream's own in-memory unit (`hr-test`) runs on, so the schema is generated as upstream
# generates its own.
#
spring:
  test:
    database:
      # Keep the datasource below, instead of the H2 that @AutoConfigureTestDatabase would otherwise swap in.
      replace: none
  datasource:
    # MODE=LEGACY and DATABASE_TO_UPPER=FALSE: upstream's `hr-test` unit. DB_CLOSE_DELAY=-1: the database outlives the
    # connections of the pool, as Boot's own embedded URL has it. The name is random so that two contexts in one JVM
    # do not create-drop each other's tables.
    url: jdbc:h2:mem:${random.uuid};MODE=LEGACY;DATABASE_TO_UPPER=FALSE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
